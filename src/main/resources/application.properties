spring.application.name=my-app

# Active profile (override with SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ----------------------------------------------------------------------
# Datasource (PostgreSQL). Values default to a local instance and are
# overridden by environment variables in Docker / production.
# ----------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todolist}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:todolist}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:todolist}

# ----------------------------------------------------------------------
# JPA / Hibernate. Flyway owns the schema, so Hibernate only validates it.
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ----------------------------------------------------------------------
# Flyway migrations
# ----------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ----------------------------------------------------------------------
# Web server
# ----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# ----------------------------------------------------------------------
# CORS: comma-separated list of allowed origins for /api/**
# ----------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# ----------------------------------------------------------------------
# Actuator: expose only health + info; used by Docker healthcheck.
# ----------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Todolist API
info.app.version=0.0.1

# ----------------------------------------------------------------------
# Journalisation structurée
# ----------------------------------------------------------------------
# Format : date | niveau | [traceId] | classe | message
# Le traceId relie toutes les lignes d'un même appel HTTP.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %-40.40logger{39} : %msg%n

# Access-log HTTP (RequestLoggingFilter) : INFO = 1 ligne/requête, DEBUG = +IP source, OFF = coupé
logging.level.http.access=INFO

# Trace des appels de méthodes (LoggingAspect, couches controller + service) :
#   INFO (défaut) = flux entrée/sortie + durée ; DEBUG = +arguments et retours ; WARN = silence
logging.level.com.example.myapp=INFO

# Astuce : pour des logs au format JSON (agrégation ELK / Loki), décommente :
# logging.structured.format.console=ecs
